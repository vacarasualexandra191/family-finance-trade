<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Am uitat parola - Budget Familial</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"/>
</head>
<body class="bg-light d-flex align-items-center" style="min-height:100vh;">
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-4">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h4 class="card-title text-center mb-4">
                        <i class="bi bi-key text-primary me-2"></i>Am uitat parola
                    </h4>

                    <div th:if="${successMessage}" class="alert alert-success"
                         th:text="${successMessage}"></div>

                    <p class="text-muted small">Introdu adresa de email asociată contului tău. Îți vom trimite un link de resetare.</p>

                    <form th:action="@{/forgot-password}" method="post">
                        <div class="mb-3">
                            <label class="form-label">Adresa de email</label>
                            <input type="email" name="email" class="form-control"
                                   placeholder="email@exemplu.ro" required autofocus/>
                        </div>
                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary">
                                Trimite link de resetare
                            </button>
                        </div>
                    </form>

                    <hr/>
                    <p class="text-center mb-0">
                        <a th:href="@{/login}">Înapoi la login</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
