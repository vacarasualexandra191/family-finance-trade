<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Login - Family Finance</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"/>
</head>
<body class="bg-light d-flex align-items-center" style="min-height:100vh;">
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-4">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h4 class="text-center mb-4 text-success">
                        💰 Family Finance
                    </h4>
                    <div th:if="${errorMessage}" class="alert alert-danger"
                         th:text="${errorMessage}"></div>
                    <div th:if="${logoutMessage}" class="alert alert-success"
                         th:text="${logoutMessage}"></div>
                    <div th:if="${successMessage}" class="alert alert-success"
                         th:text="${successMessage}"></div>

                    <form th:action="@{/login}" method="post">
                        <div class="mb-3">
                            <label class="form-label">Username</label>
                            <input type="text" name="username" class="form-control"
                                   required autofocus/>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Parola</label>
                            <input type="password" name="password" class="form-control"
                                   required/>
                        </div>
                        <div class="mb-3 form-check">
                            <input type="checkbox" class="form-check-input" name="remember-me"/>
                            <label class="form-check-label">Tine-ma minte</label>
                        </div>
                        <div class="d-grid">
                            <button type="submit" class="btn btn-success">
                                Autentificare
                            </button>
                        </div>
                    </form>
                    <hr/>
                    <p class="text-center mb-1">
                        <a th:href="@{/forgot-password}" class="text-muted small">
                            Am uitat parola
                        </a>
                    </p>
                    <p class="text-center mb-0">
                        Nu ai cont? <a th:href="@{/register}">Inregistreaza-te</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
