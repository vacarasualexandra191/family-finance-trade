<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Inregistrare - Family Finance</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"/>
</head>
<body class="bg-light d-flex align-items-center" style="min-height:100vh;">
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h4 class="text-center mb-4 text-success">
                        💰 Cont nou — Family Finance
                    </h4>
                    <div th:if="${errorMessage}" class="alert alert-danger"
                         th:text="${errorMessage}"></div>
                    <form th:action="@{/register}" method="post" th:object="${form}">
                        <div class="mb-3">
                            <label class="form-label">Username *</label>
                            <input type="text" th:field="*{username}"
                                   th:classappend="${#fields.hasErrors('username')} ? 'is-invalid'"
                                   class="form-control" required/>
                            <div class="invalid-feedback" th:errors="*{username}"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Parola * (minim 6 caractere)</label>
                            <input type="password" th:field="*{password}"
                                   th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'"
                                   class="form-control" required/>
                            <div class="invalid-feedback" th:errors="*{password}"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Nume complet *</label>
                            <input type="text" th:field="*{fullName}"
                                   class="form-control" required/>
                        </div>
                        <div class="mb-4">
                            <label class="form-label">Email *</label>
                            <input type="email" th:field="*{email}"
                                   th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"
                                   class="form-control" required/>
                            <div class="invalid-feedback" th:errors="*{email}"></div>
                        </div>
                        <div class="d-grid">
                            <button type="submit" class="btn btn-success">
                                Creeaza cont
                            </button>
                        </div>
                    </form>
                    <hr/>
                    <p class="text-center mb-0">
                        Ai deja cont? <a th:href="@{/login}">Autentifica-te</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
