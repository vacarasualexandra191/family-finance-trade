<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Resetare parola - Budget Familial</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"/>
</head>
<body class="bg-light d-flex align-items-center" style="min-height:100vh;">
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-4">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h4 class="card-title text-center mb-4">🔐 Resetare Parolă</h4>

                    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

                    <form th:if="${token != null}" th:action="@{/reset-password}" method="post">
                        <input type="hidden" name="token" th:value="${token}"/>
                        <div class="mb-3">
                            <label class="form-label">Parolă nouă (minim 6 caractere)</label>
                            <input type="password" name="newPassword" class="form-control"
                                   minlength="6" required autofocus/>
                        </div>
                        <div class="d-grid">
                            <button type="submit" class="btn btn-danger">
                                Setează parola nouă
                            </button>
                        </div>
                    </form>

                    <div th:if="${token == null}" class="text-center">
                        <a th:href="@{/forgot-password}" class="btn btn-primary">
                            Solicită un nou link
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
