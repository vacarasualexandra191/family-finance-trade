<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Confirmare cont - Budget Familial</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"/>
</head>
<body class="bg-light d-flex align-items-center" style="min-height:100vh;">
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-sm">
                <div class="card-body p-4 text-center">
                    <div th:if="${success}">
                        <div class="display-1 text-success mb-3">✅</div>
                        <h4 class="text-success">Cont confirmat!</h4>
                        <p th:text="${success}"></p>
                        <a th:href="@{/login}" class="btn btn-primary mt-2">Mergi la Login</a>
                    </div>
                    <div th:if="${error}">
                        <div class="display-1 text-danger mb-3">❌</div>
                        <h4 class="text-danger">Eroare</h4>
                        <p th:text="${error}"></p>
                        <a th:href="@{/register}" class="btn btn-primary mt-2">Înregistrează-te din nou</a>
                    </div>
                    <div th:if="${info}">
                        <div class="display-1 text-info mb-3">ℹ️</div>
                        <p th:text="${info}"></p>
                        <a th:href="@{/login}" class="btn btn-primary mt-2">Mergi la Login</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
