<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::main}, 'Tranzactie Noua')}">
<body><main>
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card border-0 shadow-sm">
            <div class="card-header bg-white">
                <h5 class="mb-0"><i class="bi bi-plus-circle me-2 text-success"></i>Tranzactie Noua</h5>
            </div>
            <div class="card-body">
                <form th:action="@{/transactions/new}" method="post" th:object="${transaction}" novalidate class="needs-validation">

                    <div class="mb-3">
                        <label class="form-label">Tip *</label>
                        <div class="d-flex gap-3">
                            <div class="form-check">
                                <input type="radio" th:field="*{type}" value="INCOME" class="form-check-input" id="income" required/>
                                <label class="form-check-label text-success fw-bold" for="income">VENIT</label>
                            </div>
                            <div class="form-check">
                                <input type="radio" th:field="*{type}" value="EXPENSE" class="form-check-input" id="expense"/>
                                <label class="form-check-label text-danger fw-bold" for="expense">CHELTUIALA</label>
                            </div>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Subcategorie *</label>
                        <select th:field="*{subCategory}" class="form-select" required>
                            <option value="">-- Selecteaza --</option>
                            <optgroup label="Cheltuieli Curente">
                                <option value="CHIRIE">Chirie</option>
                                <option value="UTILITATI">Utilitati</option>
                                <option value="ALIMENTE">Alimente</option>
                                <option value="ABONAMENTE">Abonamente</option>
                            </optgroup>
                            <optgroup label="Cheltuieli Extra">
                                <option value="MEDICAL">Medical</option>
                                <option value="ASIGURARE">Asigurare</option>
                                <option value="CONCEDIU">Concediu</option>
                                <option value="EVENIMENT_SPECIAL">Eveniment special</option>
                            </optgroup>
                            <optgroup label="Venituri">
                                <option value="SALARIU">Salariu</option>
                                <option value="FREELANCE">Freelance</option>
                                <option value="DIVIDENDE">Dividende</option>
                                <option value="ALTE_VENITURI">Alte venituri</option>
                            </optgroup>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Suma (RON) *</label>
                        <input type="number" step="0.01" min="0.01" th:field="*{amount}"
                               class="form-control" placeholder="0.00" required/>
                        <div class="invalid-feedback" th:errors="*{amount}"></div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Data *</label>
                        <input type="date" th:field="*{transactionDate}" class="form-control" required/>
                    </div>

                    <div class="mb-4">
                        <label class="form-label">Descriere *</label>
                        <input type="text" th:field="*{description}" class="form-control"
                               placeholder="ex: Lidl cumparaturi saptamanale" required/>
                        <div class="invalid-feedback" th:errors="*{description}"></div>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-success"><i class="bi bi-check-lg me-1"></i>Salveaza</button>
                        <a th:href="@{/transactions}" class="btn btn-outline-secondary">Anuleaza</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
<script>
(function(){document.querySelectorAll('.needs-validation').forEach(function(f){f.addEventListener('submit',function(e){if(!f.checkValidity()){e.preventDefault();e.stopPropagation();}f.classList.add('was-validated');});});})();
</script>
</main></body>
</html>
