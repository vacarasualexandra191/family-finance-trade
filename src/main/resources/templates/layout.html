<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="layout(content, title)">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${title + ' - Family Finance'}">Family Finance</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
    <style>
        body { background-color: #ffffff !important; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-success shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/dashboard}">
            <i class="bi bi-graph-up-arrow me-2"></i>Family Finance
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="nav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/dashboard}">
                        <i class="bi bi-speedometer2 me-1"></i>Dashboard
                    </a>
                </li>
                <li class="nav-item" th:if="${session.familyRole != 'COPIL'}">
                    <a class="nav-link" th:href="@{/transactions}">
                        <i class="bi bi-arrow-left-right me-1"></i>Tranzactii
                    </a>
                </li>
                <li class="nav-item" th:if="${session.familyRole != 'COPIL'}">
                    <a class="nav-link" th:href="@{/reports}">
                        <i class="bi bi-file-earmark-bar-graph me-1"></i>Raport Lunar
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/family}">
                        <i class="bi bi-people me-1"></i>Familia
                    </a>
                </li>
                <li class="nav-item" th:if="${session.familyRole != 'COPIL'}">
                    <a class="nav-link" th:href="@{/exchange}">
                        <i class="bi bi-currency-exchange me-1"></i>Schimb Valutar
                    </a>
                </li>
                <li class="nav-item dropdown" th:if="${session.familyRole != 'COPIL'}">
                    <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown">
                        <i class="bi bi-bar-chart-line me-1"></i>Investitii
                    </a>
                    <ul class="dropdown-menu">
                        <li><a class="dropdown-item" th:href="@{/investments}">
                            <i class="bi bi-briefcase me-1"></i>Portofoliu</a></li>
                        <li><a class="dropdown-item" th:href="@{/investments/funds}">
                            <i class="bi bi-list-ul me-1"></i>Fonduri</a></li>
                        <li><a class="dropdown-item" th:href="@{/investments/trade}">
                            <i class="bi bi-arrow-up-down me-1"></i>Cumpara/Vinde</a></li>
                        <li><a class="dropdown-item" th:href="@{/investments/suggest}">
                            <i class="bi bi-lightbulb me-1"></i>Recomandari</a></li>
                    </ul>
                </li>
            </ul>
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <form th:action="@{/logout}" method="post" class="d-inline">
                        <button type="submit" class="btn btn-outline-light btn-sm">
                            <i class="bi bi-box-arrow-right me-1"></i>Logout
                        </button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container my-4">
    <!-- Mesaje flash -->
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show">
        <i class="bi bi-check-circle me-2"></i>
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show">
        <i class="bi bi-x-circle me-2"></i>
        <span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${warningMessage}" class="alert alert-warning alert-dismissible fade show">
        <i class="bi bi-exclamation-triangle me-2"></i>
        <span th:text="${warningMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div th:replace="${content}">Continut</div>
</div>

<footer class="text-center text-muted py-3 border-top mt-4">
    <small>Family Finance &#169; 2026</small>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
